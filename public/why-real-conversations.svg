  <circle cx="51" cy="50" r="3" fill="#FFFFFF"/>
  <circle cx="58" cy="50" r="3" fill="#FFFFFF"/>
  <circle cx="65" cy="50" r="3" fill="#FFFFFF"/>

  <!-- Audio Wave Accent -->
  <path d="M16 40C16 34 18 30 21 27" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
