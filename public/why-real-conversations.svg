      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="bubbleBlue" x1="18" y1="22" x2="64" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="bubbleOrange" x1="38" y1="36" x2="78" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="96" height="96" rx="24" fill="url(#bgConv)"/>
  <circle cx="78" cy="20" r="5" fill="#3B82F6" opacity="0.2"/>

