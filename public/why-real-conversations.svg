  <path d="M22 28C22 23.5817 25.5817 20 30 20H58C62.4183 20 66 23.5817 66 28V46C66 50.4183 62.4183 54 58 54H34L24 62V54.5C22.75 53 22 51 22 46V28Z" fill="url(#bubbleBlue)"/>
