    </linearGradient>
    <linearGradient id="flameGrad" x1="26" y1="62" x2="42" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="96" height="96" rx="24" fill="url(#bgFut)"/>
  <circle cx="80" cy="22" r="5" fill="#10B981" opacity="0.2"/>

