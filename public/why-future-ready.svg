    <path d="M60 22C64 24 66 26 66 26C65 29 63 32 60 36L48 27C52 23 57 22 60 22Z" fill="#EF4444"/>

    <!-- Rocket Window Porthole -->
    <circle cx="51" cy="41" r="5" fill="#FFFFFF"/>
    <circle cx="51" cy="41" r="3.2" fill="#0284C7"/>
    <circle cx="52" cy="40" r="1.2" fill="#FFFFFF"/>
